name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm typecheck:examples
      - run: pnpm -r build
      - name: smoke the binaries
        run: |
          node packages/mcp/dist/bin.js --help
          HEDGEHOOD_SESSION_KEY=0x8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba node packages/mcp/dist/bin.js --check
          node packages/cli/dist/bin.js decode 142087026062721526102620822511099174400
